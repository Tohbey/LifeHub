spring:
  application:
    name: lifehub-service-registry

server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:lifehub-service-registry}
  client:
    # A single registry: it does not register with itself or fetch from peers.
    register-with-eureka: false
    fetch-registry: false
  server:
    # On one host, missed heartbeats mean a service is really down, not a network partition.
    # Keep self-preservation off so dead instances leave the registry and stop receiving traffic.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
